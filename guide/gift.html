<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가이드 | 품고</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#f7f7f5;--surface:#fff;--border:#e4e3df;--text-primary:#1a1a18;--text-secondary:#5e5d58;--text-muted:#9e9c96;--accent:#2563eb;--accent-light:#eff4ff;--accent-border:#bfcffe;--radius-lg:14px;}
  body{background:var(--bg);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--text-primary);padding:2rem 1rem 4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);text-decoration:none;margin-bottom:2rem;align-self:flex-start;max-width:780px;width:100%;}
  .back-btn:hover{color:var(--text-primary);}
  .empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;text-align:center;max-width:480px;width:100%;}
  .empty-icon{font-size:40px;margin-bottom:1rem;}
  .empty-title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:8px;}
  .empty-desc{font-size:13px;color:var(--text-secondary);line-height:1.7;}
</style>
</head>
<body>
<a class="back-btn" href="../index.html">← 목록으로 돌아가기</a>
<div class="empty">
  <div class="empty-icon">🚧</div>
  <div class="empty-title">가이드 작성 중</div>
  <div class="empty-desc">이 가이드는 아직 작성 중입니다.<br>완성되면 이 페이지에 내용이 채워질 예정입니다.</div>
</div>
</body>
</html>
