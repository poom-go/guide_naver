<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>재고 반출 가이드</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e4e3df;
    --border-hover: #c8c6c0;
    --text-primary: #1a1a18;
    --text-secondary: #5e5d58;
    --radius-lg: 16px;
  }

  body {
    background: var(--bg);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 2rem 1rem;
  }

  .topbar {
    max-width: 960px;
    width: 100%;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar a { display: flex; align-items: center; }
  .topbar img { height: 28px; display: block; }
  .breadcrumb {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 4px;
  }
  .breadcrumb a { color: var(--text-secondary); text-decoration: none; }
  .breadcrumb a:hover { color: var(--text-primary); }
  .breadcrumb span { color: #c8c6c0; }

  .page { max-width: 960px; width: 100%; margin: 0 auto; }

  .header { margin-bottom: 2.5rem; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
  .header p { font-size: 14px; color: var(--text-secondary); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem 1rem 1.75rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: border-color .15s, box-shadow .15s, transform .12s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
    transform: translateY(-2px);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .card.blue::before  { background: #2563eb; }
  .card.teal::before  { background: #0F6E56; }
  .card.amber::before { background: #B87018; }

  .card-title { font-size: 17px; font-weight: 700; text-align: center; }
  .card-sub { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: -8px; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="../index.html">
      <img src="https://raw.githubusercontent.com/poom-go/guide_naver/main/Primary%20Logo.png" alt="품고 로고" />
    </a>
    <div class="breadcrumb">
      <span>›</span>
      <a href="../index.html">업무 가이드</a>
      <span>›</span>
      <span style="color: var(--text-primary); font-weight: 600;">재고 반출</span>
    </div>
  </div>

  <div class="page">
    <div class="header">
      <h1>📦 재고 반출</h1>
      <p>반출 유형을 선택해주세요</p>
    </div>

    <div class="grid">
      <a class="card blue" href="stock-parcel.html">
        <div class="card-title">택배 반출</div>
        <div class="card-sub">소량 · 개별 박스</div>
      </a>
      <a class="card teal" href="stock-plt.html">
        <div class="card-title">차량 반출</div>
        <div class="card-sub">PLT 단위</div>
      </a>
      <a class="card amber" href="stock-box.html">
        <div class="card-title">차량 반출</div>
        <div class="card-sub">박스 단위</div>
      </a>
    </div>
  </div>

</body>
</html>
