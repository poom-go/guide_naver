<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>품고 나우 시스템 가이드</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e4e3df;
    --border-hover: #c8c6c0;
    --text-primary: #1a1a18;
    --text-secondary: #5e5d58;
    --radius-lg: 16px;
  }

  body {
    background: var(--bg);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .page { max-width: 960px; width: 100%; }

  .header { margin-bottom: 2.5rem; text-align: center; }
  .header-badge { display: block; font-size: 16px; color: var(--text-secondary); margin-bottom: 10px; }
  .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .header p { font-size: 15px; color: var(--text-secondary); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem 1rem 1.75rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: border-color .15s, box-shadow .15s, transform .12s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
    transform: translateY(-2px);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .card.blue::before   { background: #2563eb; }
  .card.teal::before   { background: #0F6E56; }
  .card.amber::before  { background: #B87018; }
  .card.purple::before { background: #534AB7; }

  .card-icon {
    width: 60px; height: 60px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .card.blue   .card-icon { background: #eff4ff; }
  .card.teal   .card-icon { background: #E1F5EE; }
  .card.amber  .card-icon { background: #FAEEDA; }
  .card.purple .card-icon { background: #EEEDFE; }

  .card-title { font-size: 17px; font-weight: 700; text-align: center; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <span class="header-badge">365일 가장 빠른 물류 POOMGO</span>
    <h1>품고 나우 시스템 가이드</h1>
    <p>자세한 가이드는 각 항목을 선택해주세요🙂</p>
  </div>

  <div class="grid">
    <a class="card blue" href="guides/stock.html">
      <div class="card-icon">📦</div>
      <div class="card-title">재고 반출</div>
    </a>
    <a class="card teal" href="guides/gift.html">
      <div class="card-icon">🎁</div>
      <div class="card-title">사은품</div>
    </a>
    <a class="card amber" href="guides/cs.html">
      <div class="card-icon">🎧</div>
      <div class="card-title">CS</div>
    </a>
    <a class="card purple" href="guides/faq.html">
      <div class="card-icon">💬</div>
      <div class="card-title">자주 하는 질문</div>
    </a>
  </div>
</div>
</body>
</html>
