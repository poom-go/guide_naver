<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>품고 시스템 가이드</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e4e3df;
    --border-hover: #c8c6c0;
    --text-primary: #1a1a18;
    --text-secondary: #5e5d58;
    --radius-lg: 16px;
  }

  body {
    background: var(--bg);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 2rem 1rem;
  }

  .topbar { max-width: 960px; width: 100%; margin: 0 auto 2.5rem; }
  .topbar img { height: 32px; display: block; }

  .page { max-width: 960px; width: 100%; margin: 0 auto; }

  .header { margin-bottom: 2.5rem; text-align: center; }
  .header-badge { display: block; font-size: 16px; color: var(--text-secondary); margin-bottom: 10px; }
  .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .header p { font-size: 15px; color: var(--text-secondary); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem 1rem 1.75rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    transition: border-color .15s, box-shadow .15s, transform .12s;
  }
  .card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
    transform: translateY(-2px);
  }

  .card-title { font-size: 16px; font-weight: 700; text-align: center; }

  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .header h1 { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <img src="https://raw.githubusercontent.com/poom-go/guide_naver/main/Primary%20Logo.png" alt="품고 로고" />
  </div>

  <div class="page">
    <div class="header">
      <span class="header-badge">365일 가장 빠른 물류</span>
      <h1>업무 가이드</h1>
      <p>자세한 가이드는 각 항목을 선택해주세요🙂</p>
    </div>

    <div class="grid">
      <a class="card" href="guides/stock.html">
        <div class="card-title">재고 반출</div>
      </a>
      <a class="card" href="guides/gift.html">
        <div class="card-title">사은품</div>
      </a>
      <a class="card" href="guides/return.html">
        <div class="card-title">반품</div>
      </a>
      <a class="card" href="guides/reship.html">
        <div class="card-title">재발송</div>
      </a>
    </div>
  </div>

</body>
</html>
